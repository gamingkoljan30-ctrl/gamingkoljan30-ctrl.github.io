<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Естетика краси</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(180, 130, 100, 0.06) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(140, 100, 180, 0.05) 0%, transparent 60%);
            animation: ambientGlow 20s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes ambientGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(2%, 1%) scale(1.1); }
        }

        .gallery-container {
            max-width: 1440px;
            width: 100%;
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 4rem;
            padding: 3rem 2.5rem;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .header {
            text-align: center;
            margin-bottom: 4.5rem;
            padding-bottom: 2rem;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 175, 0.3), transparent);
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: clamp(3rem, 9vw, 5.5rem);
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #f8f4f0 0%, #d4c5b8 40%, #b8a69a 80%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 4px 30px rgba(180, 130, 100, 0.15);
        }

        .header p {
            color: rgba(255, 255, 255, 0.35);
            font-weight: 300;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            font-size: 0.8rem;
            margin-top: 0.8rem;
            position: relative;
            display: inline-block;
            padding: 0 2rem;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.2rem;
        }

        .card {
            background: rgba(20, 18, 18, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 2.4rem;
            overflow: hidden;
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.6s ease, border-color 0.4s ease;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 2.4rem;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 215, 175, 0.1), transparent 50%, rgba(255, 215, 175, 0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .card:hover::before {
            opacity: 1;
        }

        .card:hover {
            transform: translateY(-12px) scale(1.01);
            box-shadow: 0 50px 80px -20px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 215, 175, 0.08);
            border-color: rgba(255, 215, 175, 0.06);
        }

        .card-image {
            width: 100%;
            height: 360px;
            background: #141111;
            overflow: hidden;
            position: relative;
        }

        .card-image::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(0deg, rgba(10, 10, 10, 0.6) 0%, transparent 100%);
            pointer-events: none;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.9s cubic-bezier(0.23, 1, 0.32, 1), filter 0.7s ease;
            filter: brightness(0.88) saturate(1.02) contrast(1.05);
        }

        .card:hover .card-image img {
            transform: scale(1.04);
            filter: brightness(0.95) saturate(1.08) contrast(1.02);
        }

        .card-content {
            padding: 2.2rem 2rem 2.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(180deg, rgba(18, 16, 16, 0.2) 0%, rgba(10, 10, 10, 0.85) 100%);
            position: relative;
        }

        .card-content blockquote {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            font-size: 1.6rem;
            line-height: 1.45;
            color: #f0eae4;
            font-style: italic;
            letter-spacing: 0.02em;
            position: relative;
            padding-left: 0.8rem;
        }

        .card-content blockquote::before {
            content: "“";
            font-size: 3.6rem;
            color: #b99e8b;
            position: absolute;
            left: -0.6rem;
            top: -1.2rem;
            opacity: 0.35;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
        }

        .card-content .author {
            margin-top: 1.8rem;
            font-size: 0.85rem;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.4rem;
            align-self: flex-end;
            transition: color 0.4s ease;
        }

        .card:hover .card-content .author {
            color: rgba(255, 255, 255, 0.6);
        }

        .card-content .author span {
            color: #d4bfb0;
            font-weight: 400;
            transition: color 0.4s ease;
        }

        .card:hover .card-content .author span {
            color: #e8d5c6;
        }

        .card-number {
            position: absolute;
            top: -0.8rem;
            right: 1.5rem;
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.02);
            letter-spacing: -0.05em;
            pointer-events: none;
            line-height: 1;
        }

        .music-player {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 1000;
            background: rgba(20, 18, 18, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 0.8rem 1.2rem 0.8rem 1.5rem;
            border-radius: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.4s ease;
        }

        .music-player:hover {
            border-color: rgba(255, 215, 175, 0.15);
            background: rgba(25, 22, 22, 0.8);
        }

        .music-player button {
            background: none;
            border: none;
            color: #d4bfb0;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
        }

        .music-player button:hover {
            background: rgba(255, 215, 175, 0.1);
            color: #e8d5c6;
            transform: scale(1.05);
        }

        .music-player .track-info {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-player .track-info span {
            color: #d4bfb0;
            font-weight: 400;
        }

        .music-volume {
            width: 60px;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
            transition: background 0.3s ease;
        }

        .music-volume::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #d4bfb0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .music-volume::-webkit-slider-thumb:hover {
            background: #e8d5c6;
            transform: scale(1.1);
        }

        .music-volume::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #d4bfb0;
            cursor: pointer;
            border: none;
        }

        @media (max-width: 768px) {
            .gallery-container {
                padding: 2rem 1.2rem;
                border-radius: 2.5rem;
            }
            .card-image {
                height: 280px;
            }
            .card-content blockquote {
                font-size: 1.35rem;
            }
            .header h1 {
                font-size: 2.8rem;
            }
            .card-number {
                font-size: 3.5rem;
                right: 1rem;
                top: -0.4rem;
            }
            .music-player {
                bottom: 1rem;
                right: 1rem;
                padding: 0.5rem 0.8rem 0.5rem 1rem;
                gap: 0.6rem;
                flex-wrap: wrap;
                width: auto;
                max-width: 280px;
            }
            .music-player .track-info {
                max-width: 80px;
                font-size: 0.65rem;
            }
            .music-volume {
                width: 40px;
            }
            .music-player button {
                width: 30px;
                height: 30px;
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem 0.8rem;
            }
            .gallery-container {
                padding: 1.2rem 0.8rem;
                border-radius: 1.8rem;
            }
            .card-image {
                height: 220px;
            }
            .card-content {
                padding: 1.5rem 1.2rem 1.8rem;
            }
            .card-content blockquote {
                font-size: 1.15rem;
            }
            .header {
                margin-bottom: 2.5rem;
                padding-bottom: 1.2rem;
            }
            .header h1 {
                font-size: 2.2rem;
            }
            .header p {
                font-size: 0.65rem;
                letter-spacing: 0.4em;
            }
            .cards-grid {
                gap: 1.2rem;
                grid-template-columns: 1fr;
            }
            .card-number {
                font-size: 2.8rem;
                right: 0.8rem;
                top: -0.2rem;
            }
            .music-player {
                bottom: 0.8rem;
                right: 0.8rem;
                padding: 0.4rem 0.6rem 0.4rem 0.8rem;
                gap: 0.4rem;
                max-width: 200px;
            }
            .music-player .track-info {
                max-width: 60px;
                font-size: 0.55rem;
            }
            .music-volume {
                width: 30px;
            }
            .music-player button {
                width: 26px;
                height: 26px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

<div class="gallery-container" id="galleryBg">

    <header class="header">
        <h1>Естетика миті</h1>
        <p>Три грані досконалості</p>
    </header>

    <div class="cards-grid">

        <div class="card" data-bg="#1f1b19">
            <div class="card-image">
                <img src="1.jpg" alt="Краса в деталях">
            </div>
            <div class="card-content">
                <span class="card-number">01</span>
                <blockquote>
                    Долижена свиня повинна блищати як пампушка цього красавчика на фото
                </blockquote>
                <div class="author">— <span>Ф. М.Долижений</span></div>
            </div>
        </div>

        <div class="card" data-bg="#1c1a1f">
            <div class="card-image">
                <img src="2.jpg" alt="Сяйво природи">
            </div>
            <div class="card-content">
                <span class="card-number">02</span>
                <blockquote>
                    У кожного лизуна повинная бути та кому він лиже -Олексій Махаму Матвійович
                </blockquote>
                <div class="author">— <span>М.Олексій</span></div>
            </div>
        </div>

        <div class="card" data-bg="#1a1e1c">
            <div class="card-image">
                <img src="3.jpg" alt="Гармонія світла">
            </div>
            <div class="card-content">
                <span class="card-number">03</span>
                <blockquote>
                    Свинота це те шо ми їмо-Махаму Матвій Лизунович
                </blockquote>
                <div class="author">— <span>Махаму М.</span></div>
            </div>
        </div>

    </div>
</div>

<div class="music-player" id="musicPlayer">
    <button id="playBtn" title="Відтворити/Пауза">▶</button>
    <div class="track-info">
        <span id="trackName">Фонова музика</span>
    </div>
    <input type="range" class="music-volume" id="volumeControl" min="0" max="1" step="0.01" value="0.3">
    <button id="muteBtn" title="Вимкнути звук">🔊</button>
</div>

<script>
    (function() {
        const container = document.getElementById('galleryBg');
        let currentBg = '#0a0a0a';
        let timeoutId = null;

        function setBackground(color) {
            if (color === currentBg) return;
            container.style.transition = 'background 0.8s cubic-bezier(0.23, 1, 0.32, 1)';
            container.style.background = color;
            currentBg = color;
        }

        function resetBackground() {
            setBackground('#0a0a0a');
        }

        const cards = document.querySelectorAll('.card');

        function handleMouseEnter(e) {
            if (timeoutId) {
                clearTimeout(timeoutId);
                timeoutId = null;
            }
            const card = e.currentTarget;
            const bgColor = card.getAttribute('data-bg');
            if (bgColor) {
                setBackground(bgColor);
            }
        }

        function handleMouseLeave() {
            timeoutId = setTimeout(resetBackground, 400);
        }

        cards.forEach(card => {
            card.addEventListener('mouseenter', handleMouseEnter);
            card.addEventListener('mouseleave', handleMouseLeave);
        });

        cards.forEach(card => {
            card.addEventListener('click', function(e) {
                if (timeoutId) {
                    clearTimeout(timeoutId);
                    timeoutId = null;
                }
                const bgColor = this.getAttribute('data-bg');
                if (bgColor) {
                    setBackground(bgColor);
                    timeoutId = setTimeout(resetBackground, 3500);
                }
            });
        });

        setBackground('#0a0a0a');
    })();

    // Музичний плеєр
    (function() {
        const audio = new Audio();
        let isPlaying = false;
        let isMuted = false;
        let currentVolume = 0.3;

        const playBtn = document.getElementById('playBtn');
        const muteBtn = document.getElementById('muteBtn');
        const volumeControl = document.getElementById('volumeControl');
        const trackName = document.getElementById('trackName');

        function loadTrack(url, name) {
            audio.src = url;
            trackName.textContent = name || 'Фонова музика';
            audio.load();
            audio.volume = currentVolume;
        }

        loadTrack('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', 'SoundHelix - Song 1');

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                playBtn.textContent = '▶';
                playBtn.title = 'Відтворити';
            } else {
                audio.play().catch(e => console.log('Autoplay blocked, click play'));
                playBtn.textContent = '⏸';
                playBtn.title = 'Пауза';
            }
            isPlaying = !isPlaying;
        }

        playBtn.addEventListener('click', togglePlay);

        audio.addEventListener('ended', function() {
            playBtn.textContent = '▶';
            isPlaying = false;
        });

        volumeControl.addEventListener('input', function(e) {
            currentVolume = parseFloat(e.target.value);
            audio.volume = currentVolume;
            if (currentVolume === 0) {
                muteBtn.textContent = '🔇';
                isMuted = true;
            } else {
                muteBtn.textContent = '🔊';
                isMuted = false;
            }
        });

        muteBtn.addEventListener('click', function() {
            if (isMuted) {
                audio.volume = currentVolume > 0 ? currentVolume : 0.3;
                volumeControl.value = currentVolume > 0 ? currentVolume : 0.3;
                muteBtn.textContent = '🔊';
                isMuted = false;
            } else {
                audio.volume = 0;
                volumeControl.value = 0;
                muteBtn.textContent = '🔇';
                isMuted = true;
            }
        });

        audio.volume = currentVolume;
        volumeControl.value = currentVolume;

        document.addEventListener('click', function() {
            if (audio.paused && !isPlaying) {
                // Не автозапускаємо, але дозволяємо клікнути
            }
        });
    })();
</script>

</body>
</html>
